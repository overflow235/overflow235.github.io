<style>
#splash{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease;-webkit-tap-highlight-color:transparent}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-in{text-align:center;padding:24px}
#splash .sp-logo{--w:min(70vw,360px);width:var(--w);height:calc(var(--w) * .214);display:flex;margin:0 auto}
#splash .sp-b,#splash .sp-t{height:100%;background-repeat:no-repeat;background-size:var(--w) 100%}
#splash .sp-b{width:39%;background-position:left top;transform-origin:50% 90%;animation:spDrop 1s cubic-bezier(.25,.8,.25,1) both}
#splash .sp-t{width:61%;background-position:right top;animation:spIn .7s .8s cubic-bezier(.3,.7,.2,1) both}
#splash .sp-tag{margin:22px 0 4px;font-size:16px;font-weight:600;color:#0b3b36;letter-spacing:-.01em;animation:spUp .6s 1.35s ease both}
#splash .sp-ref{margin:0;font-size:12px;color:#5b8f7d;animation:spUp .6s 1.6s ease both}
@keyframes spDrop{0%{opacity:0;transform:translateY(-34px) rotate(-10deg)}55%{opacity:1;transform:translateY(5px) rotate(4deg)}75%{transform:translateY(-2px) rotate(-2deg)}90%{transform:rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes spIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
.hgmk{margin-top:8px}.hgmk img{height:16px;width:auto;display:block;background:#fff;border-radius:5px;padding:3px 7px;opacity:.9}
.ahelp{font-size:12.5px;color:var(--mute,#6b7280);margin:0 0 10px;line-height:1.5}.ahelp.nx{background:var(--soft,#f4f5f7);border-radius:8px;padding:8px 10px;color:inherit}#foot .cpy{font-weight:600}
/* VOICE  a quiet, exact work tool for church staff; nothing decorative, nothing that looks generated
   IDEA   a well-kept office ledger: white pages, hairline rules, ink for actions, red only for what is due
   PICTURE each role opens on its own work list; ministries run as a row of stages with counts and dates
   COLOUR white paper, graphite ink, one cobalt for links and progress, signal red for urgent, green for done
   TYPE   Pretendard / system Korean sans; weight and size carry hierarchy, no ornaments
   LAYOUT laptop: light sidebar + working column up to 1120px; phone: thin top bar, content, bottom tabs */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121418);--ink:light-dark(#17191e,#eceef2);--ink2:light-dark(#3a3f4a,#c9cdd6);--mute:light-dark(#6b7180,#9aa1b0);
--line:light-dark(#e7e9ee,#262a33);--line2:light-dark(#d5d9e1,#343945);--panel:light-dark(#f7f8fa,#181b21);--side-bg:light-dark(#f7f8fa,#0d0f12);
--brand:light-dark(#2251d1,#7ea2ff);--brand-soft:light-dark(#eef2fc,#1a2340);--accent:light-dark(#d23b2c,#ff7a6b);--accent-soft:light-dark(#fdeeec,#3a1c19);
--good:light-dark(#17784b,#5fd39a);--good-soft:light-dark(#e9f6ef,#13301f);--warn:light-dark(#9a5b00,#f0b453);--warn-soft:light-dark(#fdf5e6,#30250f);
--btn:light-dark(#17191e,#eceef2);--btn-ink:light-dark(#ffffff,#121418);--side:var(--ink)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.01em;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);border-right:1px solid var(--line);color:var(--ink);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-weight:700;font-size:15px;line-height:1.3;padding:2px 10px 18px;letter-spacing:-.02em}
.logo small{display:block;font-weight:500;font-size:13px;color:var(--mute);margin-top:2px}
.logo .rdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rc,var(--brand));margin-right:6px;vertical-align:1px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--ink2);padding:8px 10px;border-radius:8px;font-size:14.5px;min-height:40px}
.nav:hover{background:light-dark(#eef0f3,#1c1f26)}
.nav.on{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.nav .cnt,.bnav .cnt{margin-left:auto;background:var(--accent);color:#fff;border-radius:9px;font-size:11.5px;line-height:18px;min-width:18px;text-align:center;padding:0 5px;font-weight:600}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.foot label{font-size:12.5px;color:var(--mute);padding:0 4px}
.foot select{width:100%;min-height:40px;border-radius:8px;border:1px solid var(--line);padding:0 10px;background:var(--bg);color:var(--ink);font-size:14px}
.foot .nav{justify-content:center;font-size:13.5px;color:var(--mute)}
.top,.bnav{display:none}
main{padding:32px clamp(16px,4vw,48px) 64px}
.wrap{max-width:1120px;margin:0 auto}
.pick main{padding-top:56px}
h1{font-size:clamp(23px,2.6vw,28px);line-height:1.25;letter-spacing:-.03em;font-weight:700;margin:0 0 6px;text-wrap:balance}
h2{font-size:16.5px;font-weight:650;margin:0 0 12px;letter-spacing:-.02em}
h3{font-size:14.5px;font-weight:650;margin:20px 0 8px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 24px;font-size:14.5px;max-width:72ch}
.note{font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.grid>.card,.grid>div>.card:last-child{margin-bottom:0}
.grid>div>.card{margin-bottom:20px}
.btn{min-height:42px;padding:0 16px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{background:light-dark(#2c2f37,#ffffff)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn.warn{color:var(--accent);border-color:light-dark(#f1c3bd,#5a2a24)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:500;line-height:1.6;background:light-dark(#f1f3f6,#22262e);color:var(--ink2);white-space:nowrap;border:0}
.chip.g{background:var(--good-soft);color:var(--good)}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.q{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
button.chip{min-height:30px}
.pchip{min-height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);padding:0 12px;font-size:13.5px;color:var(--ink2)}
.pchip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 6px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;border-radius:0;color:inherit}
.row:last-child{border-bottom:0}

table.pd{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;table-layout:fixed}table.pd td{border:1px solid #999;padding:5px 6px;vertical-align:middle;word-break:keep-all;overflow-wrap:anywhere;color:#111}table.pd tr.hd td,table.pd td.hc,table.pd tr.tot td{background:#eef1f6;font-weight:600}table.pd tr.hd td{text-align:center}table.pd td.n{text-align:right;font-variant-numeric:tabular-nums}table.pd.sign td{text-align:center;height:22px}table.pd.sign tr:last-child td{height:64px}
.drvc{margin-top:20px}

.secl{font-size:12.5px;color:light-dark(#1b5e3b,#8fd4ad);background:light-dark(#eef7f1,#16261d);border:1px solid light-dark(#cfe7d8,#264634);border-radius:8px;padding:7px 10px;margin:6px 0 12px;word-break:keep-all}
.crow{align-items:flex-start}.crow .chip{margin:3px 2px 0 0}.lnk{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left}.lnk:hover{text-decoration:underline}
.glock{text-align:center;padding:40px 20px;max-width:460px;margin:40px auto}
.stale{margin-top:10px}.stale summary{font-size:13.5px;color:var(--mute)}.aud{margin-top:20px}.aud summary{font-size:13.5px;color:var(--mute)}
.vpast{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.lchip{color:light-dark(var(--c),color-mix(in srgb,var(--c) 40%,#fff));border-color:light-dark(var(--c),color-mix(in srgb,var(--c) 40%,#fff))}
.tagpick .chip{white-space:normal;height:auto}

 .stk>tbody>tr>td[data-l]:not(.pm){display:flex;align-items:baseline;flex-wrap:wrap;column-gap:5px}.stk>tbody>tr>td[data-l]:not(.pm) br{display:none}
 .stk>tbody>tr>td[data-l]:not(.pm)::before{flex:none;content:attr(data-l);color:var(--mute);font-size:12px;font-weight:400}

 .stk>tbody>tr>td.pm .rm{font-weight:400}

.ounit{flex:0 0 7.5em;word-break:keep-all}

const normName=n=>String(n||'').replace(/\s*(목사|전도사|강도사|간사|집사|권사|장로|성도)$/,'').replace(/\s+/g,'').trim();
const splitNames=s=>String(s||'').split(/[\s,/·]+/).map(x=>x.replace(/[()]/g,'').trim()).filter(x=>x&&!/^\+/.test(x));
function parseRoster(text){const R={bang:[],areas:[],teams:[],units:[],bad:[]};let area=null;
  String(text||'').split(/\n/).forEach(l0=>{const l=l0.trim();if(!l||l.startsWith('//')||l.startsWith('형식'))return;
    let m;
    if((m=l.match(/^!\s*([^:：]+)[:：]\s*(.*)$/))){const k=m[1].trim();R.bang.push({k,names:k==='연도'?[m[2].trim()]:splitNames(m[2])});return}
    if((m=l.match(/^#\s*([^|]+?)\s*(?:\|\s*(.*))?$/))){area={name:m[1].trim(),sup:m[2]?normName(splitNames(m[2])[0]):null};R.areas.push(area);return}
    if((m=l.match(/^@\s*([^:：]+)[:：]\s*(.*)$/))){R.units.push({unit:m[1].replace(/\s+/g,''),names:splitNames(m[2]).map(normName)});return}
    if((m=l.match(/^([^:：]+)[:：]\s*(.*)$/))){const name=m[1].replace(/^\d+\)\s*/,'').trim();const parts=m[2].split('|');const lead=splitNames(parts[0]).map(normName);const mem=splitNames(parts.slice(1).join(' ')).map(normName);R.teams.push({name,area:area?.name||'기타',lead:lead[0]||null,lead2:lead[1]||null,members:[...lead.slice(2),...mem].filter((x,i,a)=>a.indexOf(x)===i&&x!==lead[0]&&x!==lead[1])});return}
    R.bad.push(l)});
  R.titles={};String(text||'').split(/\n/).forEach(l=>{if(/^\s*(\/\/|!\s*연도)/.test(l))return;splitPeople(l.replace(/^\s*#[^|]*\|?/,'').replace(/^[^:：]*[:：]/,'').replace(/\|/g,' ')).forEach(p=>{if(p.t&&p.t!=='직원'){const k=normName(p.n.replace(/\?/g,''));if(k)R.titles[k]=p.t}})});
  return R}
function applyRoster(text){const R=parseRoster(text);const idx={};Object.entries(DB.U).forEach(([id,u])=>{if(u.name)idx[normName(u.name)]=id});
  const get=(name,ctx)=>{const k=normName(name);if(!k)return null;let id=idx[k];if(!id){id=uid('q');DB.U[id]={name:k,role:'교역자'};idx[k]=id}const u=DB.U[id];if(ctx==='pastor'&&u.role==='행정실'){u.role='교역자';u.office=true}return id};
  const AL={홍보:'홍보디자인',디자인:'홍보디자인',출판:'교회신문',신문:'교회신문',영상:'영상팀',음향:'방송실',방송:'방송실',전산:'전산실',회계:'재정팀',재정:'재정팀',영선:'시설팀',시설:'시설팀',차량:'차량',전기:'전기기계설비',설비:'전기기계설비'};
  const dep=d=>{d=(d||'').trim();if(['홍보디자인','교회신문','영상팀','방송실','전산실','재정팀','시설팀','차량','전기기계설비'].includes(d))return d;return AL[d.replace(/(팀|실)$/,'')]||AL[d]||null};
  R.bang.forEach(({k,names})=>{
    if(k==='연도'){const y=parseInt(names[0]);if(y)DB.orgYear=y;return}
    if(k==='관리자'){names.forEach(n=>{const key=normName(n);if(!idx[key]){const old=Object.entries(idx).find(([,id])=>id==='p1');if(old)delete idx[old[0]];DB.U.p1.name=key;idx[key]='p1'}});return}
    if(k==='행정목사'){const key=normName(names[0]);if(key){DB.U.h1.name=key;DB.U.h1.pastor=true;idx[key]='h1'}return}
    if(k==='행정실'){names.forEach(n=>{const key=normName(n);if(idx[key]){DB.U[idx[key]].office=true}else{const id=uid('a');DB.U[id]={name:key,role:'행정실'};idx[key]=id}});return}
    if(k==='찬양'){names.forEach(n=>{const id=get(n,'pastor');Object.assign(DB.U[id],{worship:true,dept:'찬양팀'})});return}
    if(k==='새가족팀'){names.forEach(n=>{const key=normName(n);if(!idx[key]){const id=uid('n');DB.U[id]={name:key,role:'새가족팀'};idx[key]=id}});return}

  const defType=a=>(CATALOG.find(c=>c[0]===a)||[])[1]||'행사';
  R.teams.forEach(t=>{const ar=DB.AREAS.find(x=>x.name===t.area);let tm=DB.TEAMS.find(x=>x.name===t.name);const lead=t.lead?get(t.lead,'pastor'):null;const lead2=t.lead2?get(t.lead2,'pastor'):null;const members=t.members.map(n=>get(n,'pastor'));
    if(!tm){tm={id:uid('t'),name:t.name,area:t.area,type:typeFor(t.name,defType(t.area)),sup:ar?.sup||null,lead,members:[]};DB.TEAMS.push(tm)}else{tm.area=t.area;tm.lead=lead;if(ar?.sup)tm.sup=ar.sup}

function rvEach(rv,fn){rv.b.forEach((b,i)=>b.p.forEach((p,k)=>fn(p,{kind:b.k.startsWith('직원')?'직원':b.k,where:b.k.replace(/^직원\s*/,''),sec:'b'}))); rv.a.forEach((a,i)=>{fn(a.sup,{kind:'총괄',where:a.name,sec:i});a.t.forEach((t,j)=>{fn(t.lead,{kind:'팀장',where:t.name,sec:i,path:`a.${i}.t.${j}`});if(t.lead2)fn(t.lead2,{kind:'팀장',where:t.name,sec:i,path:`a.${i}.t.${j}`});t.m.forEach(p=>fn(p,{kind:'팀원',where:t.name,sec:i,path:`a.${i}.t.${j}`}))})});rv.u.forEach(u=>u.p.forEach(p=>fn(p,{kind:'담당',where:u.unit,sec:'u'})))}

function rvAnalyze(rv){const P=new Map();rvEach(rv,(p,w)=>{const k=pKey(p.n);if(!k)return;if(!P.has(k))P.set(k,{k,n:p.n.replace(/\?/g,''),t:p.t,list:[],q:false});const e=P.get(k);if(!e.t&&p.t)e.t=p.t;if(/\?/.test(p.n))e.q=true;e.list.push(w)});

function cleanTeam(t){const lk=pKey(t.lead.n),lk2=pKey(t.lead2&&t.lead2.n);const seen=new Set();t.m=t.m.filter(p=>{const k=pKey(p.n);if(!k||k===lk||(lk2&&k===lk2)||seen.has(k))return false;seen.add(k);return true})}
function mergeTeams(rv,dst,src){const D=rv.a[dst.i].t[dst.j],Sx=rv.a[src.i].t[src.j];if(!pKey(D.lead.n))D.lead=Sx.lead;else if(pKey(Sx.lead.n)&&pKey(Sx.lead.n)!==pKey(D.lead.n))D.m.push(Sx.lead);if(Sx.lead2&&pKey(Sx.lead2.n)){if(!D.lead2||!pKey(D.lead2.n))D.lead2=Sx.lead2;else if(pKey(Sx.lead2.n)!==pKey(D.lead2.n))D.m.push(Sx.lead2)}D.m.push(...Sx.m);cleanTeam(D);rv.a[src.i].t.splice(src.j,1)}

function turnCfg(){DB.set=DB.set||{};DB.set.turn=DB.set.turn||{on:true,month:11,day:25};return DB.set.turn}
function turnOpenDate(y){const c=turnCfg();return iso(new Date(y,c.month-1,c.day))}
function uTok(id){const u=DB.U[id];if(!u||!u.name)return '';const m=u.name.match(new RegExp('^(.+?)\\s*('+TRX+')$'));return m?`${m[1].replace(/\s+/g,'')}(${m[2]})`:u.name.replace(/\s+/g,'')}
function rosterNow(year){const U=Object.entries(DB.U).filter(([,u])=>u.name);const ids=f=>U.filter(([,u])=>f(u)).map(([id])=>uTok(id)).filter(Boolean).join(' ');const L=[`!연도: ${year}`,`!관리자: ${uTok('p1')}`];
  if(DB.U.h1?.name)L.push(`!행정목사: ${uTok('h1')}`);const off=ids(u=>u.role==='행정실'||u.office);if(off)L.push(`!행정실: ${off}`);const w=ids(u=>u.worship);if(w)L.push(`!찬양: ${w}`);const nf=ids(u=>u.role==='새가족팀');if(nf)L.push(`!새가족팀: ${nf}`);
  [...new Set(U.filter(([,u])=>u.role==='직원'&&!u.worship&&u.dept).map(([,u])=>u.dept))].forEach(d=>L.push(`!직원 ${d}: ${ids(u=>u.role==='직원'&&!u.worship&&u.dept===d)}`));
  const AN=(DB.AREAS||[]).map(a=>a.name);const team=t=>`${t.name}: ${t.lead?uTok(t.lead):''}${t.lead2?' '+uTok(t.lead2):''} | ${t.members.map(uTok).filter(Boolean).join(' ')}`;
  (DB.AREAS||[]).forEach(a=>{L.push(`#${a.name}${a.sup?' | '+uTok(a.sup):''}`);DB.TEAMS.filter(t=>t.area===a.name).forEach(t=>L.push(team(t)))});
  const rest=DB.TEAMS.filter(t=>!AN.includes(t.area));if(rest.length){L.push('#기타');rest.forEach(t=>L.push(team(t)))}
  const units={};U.forEach(([id,u])=>{const k=u.gu||u.buseo;if(k&&isPastor(u))(units[k]=units[k]||[]).push(uTok(id))});Object.entries(units).sort((a,b)=>a[0].localeCompare(b[0],'ko',{numeric:true})).forEach(([k,v])=>L.push(`@${k}: ${v.join(' ')}`));
  return L.join('\n')}

function turnDiff(text){const R=parseRoster(text);const cur=new Map(DB.TEAMS.map(t=>[t.name,t]));const names=new Set(R.teams.map(t=>t.name));
  const add=R.teams.filter(t=>!cur.has(t.name)).map(t=>t.name);const gone=DB.TEAMS.filter(t=>!names.has(t.name)).map(t=>t.name);
  const lead=R.teams.filter(t=>cur.has(t.name)&&normName(nm(cur.get(t.name).lead))!==normName((t.lead||'').replace(/\?/g,''))).map(t=>`${t.name}: ${normName(nm(cur.get(t.name).lead))||'없음'} → ${normName(t.lead||'')||'없음'}`);

  return {teams:R.teams.length,areas:R.areas.length,add,gone,lead,newP,q:(text.match(/\?/g)||[]).length}}

function webDB(){const F=W.F,fs=W.fs;const clean=d=>JSON.parse(JSON.stringify(d));const sd=s=>({id:s.id,exists:s.exists(),data:()=>s.exists()?s.data():undefined,metadata:s.metadata});
  const err=e=>({code:e&&e.code==='permission-denied'?'invalid_argument':e&&e.code==='resource-exhausted'?'quota_exceeded':'unavailable',message:String(e&&e.message||e)});
  const wrap=p=>p.catch(e=>{throw err(e)});
  const dref=p=>{const r=F.doc(fs,p);return {id:r.id,path:p,get:async()=>sd(await wrap(F.getDoc(r))),set:d=>wrap(F.setDoc(r,clean(d))),update:d=>wrap(F.updateDoc(r,clean(d))),delete:()=>wrap(F.deleteDoc(r)),onSnapshot:(n,e)=>F.onSnapshot(r,s=>n(sd(s)),x=>e&&e(err(x)))}};

  return {doc:dref,collection:cref}}

function webSampler(direct){const C=direct?((GD&&GD.ai)||{}):(WEB.ai||{});if(!direct&&!C.endpoint)return null;
  const call=async body=>{let r;if(direct==='relay'){if(!GT.tok||GT.exp<Date.now()+20000){gExpired();throw {code:'auth'}}r=await fetch(GD.ai.relayUrl,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify({token:GT.tok,body})});const j=await r.json().catch(()=>({error:'server'}));if(j.error==='daily_limit'){toast(`오늘 AI 사용 한도(${j.limit}회)를 다 썼습니다. 내일 다시 쓸 수 있습니다`);throw {code:'rate_limited'}}if(j.error==='login'){toast('승인된 사람만 AI를 쓸 수 있습니다');throw {code:'ai_forbidden'}}if(j.error)throw {code:'ai_error'};if(typeof j.left==='number'&&j.left<=3)toast(`오늘 AI 남은 횟수 ${Math.max(0,j.left)}회`);return j}if(direct){const {tier,...b}=body;r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':direct,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:tier==='fast'?(C.modelFast||'claude-haiku-5-5'):(C.model||'claude-sonnet-5-5'),...b})});if(r.status===401)toast('AI 키를 확인해 주세요 (설정 → 내 AI 연결)')}else{const tok=await W.auth.currentUser.getIdToken();r=await fetch(C.endpoint,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(body)})}
    if(r.status===429)throw {code:'rate_limited'};if(r.status===403)throw {code:'ai_forbidden'};if(!r.ok)throw {code:'ai_error',status:r.status};return r.json()};
  const sm=async(input,opts={})=>{const messages=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({...m}));
    if(opts.images&&opts.images.length){const im=[];for(const b of opts.images)im.push({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:await blobB64(b)}});const last=messages[messages.length-1];last.content=[...im,{type:'text',text:typeof last.content==='string'?last.content:''}]}

    for(let turn=0;turn<6;turn++){const res=await call({messages,tier:opts.modelTier||'default',max_tokens:opts.maxTokens||4000,...(tools.length?{tools}:{})});const bl=res.content||[];text=bl.filter(x=>x.type==='text').map(x=>x.text).join('');try{opts.onText&&opts.onText({text})}catch(e){}
      const tu=bl.filter(x=>x.type==='tool_use');if(!tu.length||res.stop_reason!=='tool_use')break;messages.push({role:'assistant',content:bl});const out=[];
      for(const u of tu){const t=(opts.tools||[]).find(x=>x.name===u.name);let v,bad=false;try{v=t?await t.execute(u.input||{}):'없는 도구'}catch(e){v=String(e&&e.message||e);bad=true}out.push({type:'tool_result',tool_use_id:u.id,content:typeof v==='string'?v:JSON.stringify(v),is_error:bad})}messages.push({role:'user',content:out})}
    return {text}};
  sm.json=async(p,o)=>{const r=await sm(p+'\n\nJSON만 출력해. 설명 없이.',o);const t=r.text;const a=t.indexOf('{'),b=t.indexOf('[');const s=(b>=0&&(a<0||b<a))?b:a;const e=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));return JSON.parse(t.slice(s,e+1))};
  sm.limits=()=>({images:{maxCount:C.maxImages||5,maxInputBytes:C.maxImageBytes||5e6}});return sm}

/* ================= 무료 웹: 깃허브 Pages + 구글 로그인 + 구글 드라이브 DB =================

async function gf(url,o={}){if(!GT.tok||GT.exp<Date.now()+20000){gExpired();throw {code:'auth'}}const r=await fetch(url,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+GT.tok}});
  if(r.status===401){gExpired();throw {code:'auth'}}if(r.status===403||r.status===404)throw {code:r.status===404?'notfound':'invalid_argument',status:r.status};if(!r.ok)throw {code:'unavailable',status:r.status};return r}
async function gList(q,fields){let out=[],pt='';do{const u=`${DAPI}?q=${encodeURIComponent(q)}&fields=${encodeURIComponent('nextPageToken,'+(fields||'files(id,name,modifiedTime,owners(emailAddress))'))}&pageSize=1000${pt?'&pageToken='+pt:''}`;const j=await (await gf(u)).json();out=out.concat(j.files||[]);pt=j.nextPageToken||''}while(pt);return out}

function driveDB(F){const C={byName:new Map(),cache:new Map(),L:new Set(),busy:false,timer:null,polled:false,q:new Map()};
  const fname=p=>p.replace(/\//g,'__')+'.json';const skip=p=>/^(joins2|pii2|seen2|members2)(\/|$)/.test(p);
  async function poll(){if(C.busy)return;C.busy=true;try{const fs=await gList(`'${F}' in parents and trashed=false and mimeType='application/json'`,'files(id,name,modifiedTime)');const seen=new Set();
      for(const f of fs){seen.add(f.name);const o=C.byName.get(f.name);if(!o||o.mt!==f.modifiedTime){try{C.cache.set(f.name,JSON.parse(await gRead(f.id)));C.byName.set(f.name,{id:f.id,mt:f.modifiedTime})}catch(e){}}}
      for(const n of [...C.cache.keys()])if(!seen.has(n)){C.cache.delete(n);C.byName.delete(n)}C.polled=true;C.L.forEach(fn=>fn())}catch(e){}finally{C.busy=false}}
  const start=()=>{if(C.timer)return;poll();C.timer=setInterval(()=>{if(document.visibilityState==='visible')poll()},15000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()})};
  const snapDoc=p=>{const d=C.cache.get(fname(p));return {id:p.split('/').pop(),exists:!!d,data:()=>d,metadata:{fromCache:false}}};
  const snapCol=p=>{const pre=p.replace(/\//g,'__')+'__';const docs=[...C.cache.entries()].filter(([n])=>n.startsWith(pre)&&!n.slice(pre.length,-5).includes('__')).map(([n,d])=>({id:n.slice(pre.length,-5),exists:true,data:()=>d,metadata:{fromCache:false}}));return {docs,empty:!docs.length,size:docs.length,metadata:{fromCache:false},docChanges:()=>[]}};
  const dref=p=>({id:p.split('/').pop(),path:p,get:async()=>{if(!C.polled)await poll();return snapDoc(p)},
    set:d=>{if(skip(p))return Promise.resolve();const n=fname(p);const body=JSON.stringify(d);const job=(C.q.get(n)||Promise.resolve()).then(async()=>{const o=C.byName.get(n);let r;if(!o)r=await gCreate(n,F,'application/json',body);else r=await gUpdate(o.id,'application/json',body);C.byName.set(n,{id:r.id||o.id,mt:r.modifiedTime});C.cache.set(n,JSON.parse(body));setTimeout(()=>C.L.forEach(fn=>fn()),0)});C.q.set(n,job.catch(()=>{}));return job},
    update:async d=>{const cur=snapDoc(p);return dref(p).set({...(cur.data()||{}),...d})},
    delete:async()=>{if(skip(p))return;const n=fname(p);const o=C.byName.get(n);if(o){await gDel(o.id).catch(()=>{});C.byName.delete(n);C.cache.delete(n)}},
    onSnapshot:nx=>{if(skip(p)){setTimeout(()=>nx({id:'',exists:false,data:()=>undefined,metadata:{fromCache:false}}),5);return ()=>{}}const fn=()=>{if(C.polled)nx(snapDoc(p))};C.L.add(fn);start();if(C.polled)setTimeout(fn,0);return ()=>C.L.delete(fn)}});
  const cref=p=>({path:p,doc:id=>dref(p+'/'+(id||Math.random().toString(36).slice(2))),get:async()=>{await poll();return snapCol(p)},
    onSnapshot:nx=>{if(skip(p)){setTimeout(()=>nx({docs:[],empty:true,size:0,metadata:{fromCache:false}}),5);return ()=>{}}const fn=()=>{if(C.polled)nx(snapCol(p))};C.L.add(fn);start();if(C.polled)setTimeout(fn,0);return ()=>C.L.delete(fn)}});
  return {doc:dref,collection:cref,poll}}

function csvParse(t){const R=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);R.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);R.push(row)}return R}

const CL={user:null,db:null,me:null,owner:false,uid:null,ready:false,err:'',joins:[],myJoin:undefined,synced:{},pend:new Set(),busy:false,t:null,ro:false,needR:false,started:false};
const CL_SKIP=['V','KJ','AUD','NC','FAM','SUMS','ROLL'];const CL_CH=180000;
const clJSON=k=>{let v=DB[k];if(k==='I')v=(v||[]).map(i=>i&&i.dataUrl?Object.assign({},i,{dataUrl:undefined}):i);return JSON.stringify(v===undefined?null:v)};
const clKeys=()=>Object.keys(DB).filter(k=>!CL_SKIP.includes(k));

async function clFlush(){if(CL.busy){clearTimeout(CL.t);CL.t=setTimeout(clFlush,700);return}CL.busy=true;
  try{for(const k of [...CL.pend]){const json=clJSON(k);if(json===CL.synced[k]?.json){CL.pend.delete(k);continue}const ver=Date.now().toString(36)+Math.random().toString(36).slice(2,6);CL.wv=CL.wv||{};CL.wv[k]=ver;const n=Math.max(1,Math.ceil(json.length/CL_CH));const oldN=CL.synced[k]?.n||1;
      if(n>1)for(let i=0;i<n;i++)await CL.db.doc(`app2/${k}~${i}`).set({ver,s:json.slice(i*CL_CH,(i+1)*CL_CH)});
      await CL.db.doc('app2/'+k).set(n>1?{ver,n,by:CL.uid,at:new Date().toISOString()}:{ver,n,j:json,by:CL.uid,at:new Date().toISOString()});
      for(let i=(n>1?n:0);i<oldN&&oldN>1;i++)CL.db.doc(`app2/${k}~${i}`).delete().catch(()=>{});
      CL.synced[k]={ver,json,n};CL.pend.delete(k)}}
  catch(e){const c=e&&e.code;if(c==='invalid_argument'){CL.ro=true;CL.pend.clear();toast('보기 권한만 있어 저장되지 않습니다. 최종 관리자에게 편집 권한을 요청해 주세요')}else if(c==='quota_exceeded')toast('교회 DB 용량이 가득 찼습니다. 최종 관리자에게 알려 주세요');else{toast('저장이 잠시 늦어지고 있습니다. 곧 다시 저장합니다');clearTimeout(CL.t);CL.t=setTimeout(clFlush,8000+Math.random()*4000)}}

function clApply(docs){const M=new Map(docs.map(d=>[d.id,d.data()]));let ch=false;
  for(const [id,h] of M){if(id.includes('~')||!h||!h.ver)continue;const k=id;if(CL_SKIP.includes(k))continue;if(CL.synced[k]?.ver===h.ver||(CL.wv&&CL.wv[k]===h.ver))continue;
    let json=h.j;if((h.n||1)>1){const parts=[];for(let i=0;i<h.n;i++){const c=M.get(`${k}~${i}`);if(!c||c.ver!==h.ver){parts.length=0;break}parts.push(c.s)}if(parts.length!==h.n)continue;json=parts.join('')}
    if(typeof json!=='string')continue;if(CL.pend.has(k)&&h.by===CL.uid)continue;
    let v;try{v=JSON.parse(json)}catch(e){continue}

  DB.M.forEach(m=>{(m.board||[]).forEach(g=>L.push({by:g.by,date:g.date,k:'소통방',m}));(m.talk||[]).forEach(g=>L.push({by:g.by,date:g.date,k:'확인 대화',m}))});
  (DB.COL||[]).forEach(c=>{L.push({by:c.from,date:c.date,k:'협업 요청'});(c.msgs||[]).forEach(g=>L.push({by:g.by,date:g.date,k:'협업 대화'}))});

  return L.filter(x=>x.by&&x.date)}
function statsData(days){const since=add(TODAY,-days);const inP=d=>d&&d>=since&&d<=TODAY;const L=actLog();
  const ppl=Object.entries(DB.U).filter(([id,u])=>u.name&&(u.pid||id==='p1'));
  const rows=ppl.map(([id,u])=>{const my=DB.T.filter(t=>(t.who===id||t.req?.assignee===id)&&minOf(t.mid));const live=my.filter(t=>{const m=minOf(t.mid);return active(m)&&!pre(m)});
    const open=live.filter(t=>t.status!=='완료');const late=open.filter(t=>diff(dueOf(t),TODAY)<0);const done=my.filter(t=>t.status==='완료'&&inP(((t.reports||[]).at(-1)||{}).date));
    const A=L.filter(x=>x.by===id);const AP=A.filter(x=>inP(x.date));const rep=AP.filter(x=>x.k==='보고').length;const talk=AP.filter(x=>/대화|소통방|협업/.test(x.k)).length;
    const last=A.map(x=>x.date).sort().pop()||'';const seen=GD?last:(CL.seen[id]||'').slice(0,10);const lead=DB.TEAMS.filter(t=>t.lead===id||t.lead2===id).length;
    const flags=[];if(!seen||diff(TODAY,seen)>14)flags.push(seen?'2주 넘게 접속 없음':'접속 기록 없음');if(late.length>=3)flags.push(`지연 ${late.length}건`);if(open.length&&(!last||diff(TODAY,last)>14))flags.push('맡은 일은 있는데 2주 활동 없음');
    return {id,name:u.name,roles:rolesTxt(id)||u.role||'',unit:unitOf(u),lead,open:open.length,late:late.length,done:done.length,rep,talk,act:AP.length,last,seen,flags}}).sort((a,b)=>b.act-a.act||b.open-a.open);
  const mins=DB.M.filter(active).map(m=>{const ts=DB.T.filter(t=>t.mid===m.id);const dn=ts.filter(t=>t.status==='완료').length;const lt=ts.filter(t=>t.status!=='완료'&&!pre(m)&&diff(dueOf(t),TODAY)<0).length;const lastTalk=L.filter(x=>x.m===m).map(x=>x.date).sort().pop()||'';
    return {id:m.id,name:m.name,team:m.team,lead:nm(m.lead),stage:STAGE_LABEL[stageOf(m)]||stageOf(m),done:dn,total:ts.length,late:lt,lastTalk}}).sort((a,b)=>b.late-a.late);
  const weeks=[...Array(8)].map((_,i)=>{const e=add(TODAY,-7*i),s=add(e,-6);const W=L.filter(x=>x.date>=s&&x.date<=e);return {label:`${Number(s.slice(5,7))}/${Number(s.slice(8))}`,talk:W.filter(x=>/대화|소통방|협업/.test(x.k)).length,rep:W.filter(x=>x.k==='보고').length}}).reverse();
  const on=rows.filter(r=>r.seen&&diff(TODAY,r.seen)<=7).length;
  return {days,rows,mins,weeks,tot:{people:rows.length,on7:on,open:rows.reduce((a,r)=>a+r.open,0),late:rows.reduce((a,r)=>a+r.late,0),done:rows.reduce((a,r)=>a+r.done,0),talk:rows.reduce((a,r)=>a+r.talk,0),rep:rows.reduce((a,r)=>a+r.rep,0)}}}

function issues(){
  const L=[];
  DB.T.forEach(t=>{const m=minOf(t.mid);if(!m||!active(m)||pre(m))return;const due=dueOf(t);
    if(t.status!=='완료'&&diff(due,TODAY)<0)L.push({lv:'높음',t:`마감 지난 일: ${t.title}`,s:`${m.name} · ${fmt(due)} · ${t.req?t.req.dept:nm(t.who)||'담당 없음'}`,a:'fixTask:'+t.id});
    if(!t.req&&!t.who)L.push({lv:'보통',t:`담당자 없는 일: ${t.title}`,s:`${m.name} · 팀장 ${nm(m.lead)}`,a:'fixTask:'+t.id});
    if(t.req&&!t.req.assignee&&t.req.state!=='최종 컨펌')L.push({lv:'보통',t:`부서 담당자 미지정: ${t.title}`,s:`${t.req.dept} · ${m.name}`,a:'fixTask:'+t.id});
    if(t.req&&t.req.state==='시안 확인'){const lv=t.req.versions.at(-1);if(lv&&diff(TODAY,lv.date)>=3)L.push({lv:'보통',t:`컨펌 ${diff(TODAY,lv.date)}일째 대기: ${t.title}`,s:`${m.name} · 팀장 ${nm(m.lead)}`,a:'openM:'+m.id})}});
  DB.M.filter(active).forEach(m=>{const b=budgetOf(m);if(b.total&&b.used+b.pend>b.total)L.push({lv:'높음',t:`예산 초과: ${m.name}`,s:`${won(b.used+b.pend)} / ${won(b.total)}`,a:'adminM:'+m.id});else if(b.total&&(b.used+b.pend)/b.total>=.9)L.push({lv:'보통',t:`예산 90% 넘음: ${m.name}`,s:`${won(b.used+b.pend)} / ${won(b.total)}`,a:'adminM:'+m.id});
    if((m.stage==='확인'||m.stage==='승인')&&m.reqDate&&diff(TODAY,m.reqDate)>=3)L.push({lv:'보통',t:`${STAGE_LABEL[m.stage]} ${diff(TODAY,m.reqDate)}일째 대기: ${m.name}`,s:m.stage==='확인'?`총괄 ${nm(teamOf(m.team)?.sup)} 확인 필요`:'행정목사 확인 필요',a:'adminM:'+m.id});

  DB.M.filter(m=>m.stage==='완료').forEach(m=>{const miss=teamsOf(m).filter(tn=>!m.fb.some(f=>f.team===tn));if(miss.length)L.push({lv:'낮음',t:`피드백 누락: ${m.name}`,s:miss.join(', '),a:'adminM:'+m.id})});
  DB.E.filter(e=>!e.receipt&&e.state!=='반려').forEach(e=>L.push({lv:'낮음',t:`영수증 없는 지출: ${e.title} ${won(e.amount)}`,s:`${minOf(e.mid).name} · ${nm(e.by)}`,a:'openM:'+e.mid}));
  overlaps().forEach(([a,b])=>L.push({lv:'보통',t:`일정 겹침: ${a.name} · ${b.name}`,s:`${fmt(a.start)}~${fmt(endOf(a))} / ${fmt(b.start)}~${fmt(endOf(b))} · 본당 · 방송실 확인`,a:'adminM:'+b.id}));
  DB.NC.filter(n=>n.status==='배정 대기').forEach(n=>L.push({lv:'보통',t:`돌봄목자 미배정: ${n.name} 성도`,s:`${n.gu} · ${fmt(n.reg)} 등록`,a:'ncAssign:'+n.id}));

function hmTodos(){

}

function fitOf(file,w){return new Promise(res=>{if(!file||!file.type?.startsWith('image/'))return res(null);const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const k=Math.min(1,w/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8))};img.onerror=()=>res(null);img.src=url})}

function guardAnswer(text,seen,q,mode){const ids=[...String(text).matchAll(/\[\[([^\]]+)\]\]/g)].map(x=>x[1]);const ok=ids.filter(id=>seen.has(id));

  const notFound=/찾지 못했습니다/.test(t);
  if(!ok.length&&!notFound&&!S.draftApp){const hits=search(q,mode==='admin'?'행정':'전체',true).slice(0,5);return '교회 자료에서 근거를 찾지 못해 답하지 않았습니다. (외부 자료는 쓰지 않습니다)\n'+(hits.length?'비슷한 자료:\n'+hits.map(h=>'- [['+h.id+']]').join('\n'):'담당 부서에 문의해 주세요.')}

    const tools=[

      {name:'read_ministry',description:'사역 정보: 팀, 팀장, 팀원, 주제, 본문, 기간, 단계, 할 일(담당 · 진행률 · 최근 보고), 부서 요청 상태, 예산, 팀별 피드백, 결과 보고.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id']},execute:({id})=>{const m=minOf(id);if(!m)throw new Error('없는 사역');const b=budgetOf(m);seen.add(m.id);return {id:m.id,name:m.name,team:m.team,lead:nm(m.lead),members:m.members.map(nm),theme:m.theme,passage:m.passage,start:m.start,days:m.days,stage:stageOf(m),tasks:DB.T.filter(t=>t.mid===id).map(t=>({due:dueOf(t),title:t.title,who:t.req?t.req.dept:nm(t.who),status:t.status,progress:t.progress,lastReport:t.reports.at(-1)?.text||null,request:t.req?t.req.state:null})),budget:{total:b.total,used:b.used,pending:b.pend},feedback:m.fb,report:m.report||null}}}];

    const r=await sm([{role:'user',content:sys+'\n\n질문: '+q}],{tools,cache:false,onText:({text})=>{log[idx].text=text;paint()}});

function vRow(v){return `<button class="row" data-act="visit:${v.id}"><span class="when">${fmt(v.date)}</span><span style="flex:1"><span class="rt">${esc(v.family)}</span><br><span class="rm">${v.zone} · ${v.type}${v.follow?' · 후속: '+esc(v.follow):''}</span></span>${v.planned?'<span class="chip">예정</span>':v.follow&&!v.done?'<span class="chip w">후속 남음</span>':'<span class="chip g">완료</span>'}</button>`}

  <input class="search" id="guq" type="search" placeholder="심방 기록 · AI 정리 · 교적 자료에서 찾기 (예: 병문안, 4${ZN}, 후속)" value="${esc(S.guq)}" aria-label="교구 자료 검색"><div id="gures">${guResHTML()}</div>
  <div class="grid" style="margin-top:20px"><div class="card"><h2>${ZN}별 심방률</h2>${g.zones.map(z=>{const p=Math.round(z.visited/z.hh*100);return `<div class="brow"><span>${z.name} · ${z.leader}</span><b>${z.visited}/${z.hh}${g.kind==='부서'?'명':'세대'} · ${p}%</b><div class="bbar"><i style="width:${p}%;${p<55?'background:var(--accent)':''}"></i></div></div>`}).join('')}<p class="note">55% 아래 ${ZN}은 붉게 표시합니다.</p>${g.kind==='부서'?'':sarangHTML(g)}</div>
  <div class="card"><h2>교적 앱에 자료 요청</h2><div class="sugs">${ROLLS.map(r=>`<button data-act="roll:${r}">${r}</button>`).join('')}</div><h3>받은 자료</h3><div class="list">${myRoll().map(r=>`<button class="row" data-act="rollView:${r.id}"><span class="when">${fmt(r.date)}</span><span style="flex:1" class="rt">${esc(r.title)}</span><span class="rm">${r.rows.length}행</span></button>`).join('')||'<p class="note">요청하면 교적 앱에서 정리되어 여기에 쌓입니다.</p>'}</div><h3>${g.kind} 새가족</h3><div class="list">${ncs.map(n=>`<div class="row"><span style="flex:1"><span class="rt">${esc(n.name)} 성도</span><br><span class="rm">${n.status==='교육 중'?weekOf(n)+'주차':n.status} · ${nm(n.carer)||'목자 배정 전'}</span></span>${quiet(n)?'<span class="chip a">연락 필요</span>':''}</div>`).join('')}</div></div></div>
  <div class="grid" style="margin-top:20px"><div class="card"><h2>심방 기록</h2><div class="list">${myV().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(vRow).join('')}</div></div><div class="card"><div class="bar"><h2 style="margin:0;flex:1">AI 정리 자료</h2><button class="btn sm pri" data-act="guAI" ${S.busy?'disabled':''}>이번 달 심방 정리</button></div><div class="list" style="margin-top:8px">${mySums().map(x=>`<button class="row" data-act="sum:${x.id}"><span class="when">${fmt(x.date)}</span><span style="flex:1" class="rt">${esc(x.title)}</span></button>`).join('')}</div><p class="note">AI에는 날짜 · 마을 · 심방 유형 · 후속 조치 여부만 보냅니다. 가정 이름과 메모는 보내지 않습니다.</p></div></div>`;
}
function guResHTML(){const w=S.guq.trim().toLowerCase().split(/\s+/).filter(Boolean);if(!w.length)return '';const hit=s=>w.every(x=>s.toLowerCase().includes(x));const vs=myV().filter(v=>hit([v.family,v.zone,v.type,v.memo,v.follow,v.planned?'예정':'',v.follow&&!v.done?'후속':''].join(' ')));const ss=mySums().filter(x=>hit(x.title+' '+x.text));const rs=myRoll().filter(r=>hit(r.title+' '+r.rows.flat().join(' ')));return `<div class="card" style="margin-top:12px"><p class="note" style="margin-top:0">심방 기록 ${vs.length} · AI 정리 ${ss.length} · 교적 자료 ${rs.length}</p><div class="list">${vs.map(vRow).join('')}${ss.map(x=>`<button class="row" data-act="sum:${x.id}"><span class="chip">AI 정리</span><span style="flex:1" class="rt">${esc(x.title)}</span></button>`).join('')}${rs.map(r=>`<button class="row" data-act="rollView:${r.id}"><span class="chip">교적 자료</span><span style="flex:1" class="rt">${esc(r.title)}</span></button>`).join('')}</div></div>`}
const PEOPLE=['김민수','이정희','박성호','최영미','정우진','강수정','조현우','윤지혜','장태호','임소연','한상철','오미경'];
function rollData(title){const g=curGU();const z=i=>g.zones[i%4].name;
  if(title==='미심방 세대 명단')return {cols:['세대','마을','최근 심방'],rows:PEOPLE.slice(6).map((p,i)=>[p+' 가정',z(i+3),i%2?'2024년':'기록 없음'])};
  if(title==='이번 달 생일 · 결혼기념일')return {cols:['이름','마을','날짜','구분'],rows:PEOPLE.slice(0,6).map((p,i)=>[p,z(i),`${Number(TODAY.slice(5,7))}월 ${3+i*4}일`,i%3?'생일':'결혼기념일'])};
  if(title==='3주 이상 결석자')return {cols:['이름','마을','마지막 출석','마을목자'],rows:PEOPLE.slice(3,8).map((p,i)=>[p,z(i+1),fmt(add(TODAY,-24-i*6)),g.zones[(i+1)%4].leader])};
  if(title==='마을별 인원')return {cols:['마을','세대','교인','마을목자','사랑목자'],rows:g.zones.map(x=>[x.name,x.hh,Math.round(x.hh*2.75),x.leader,(x.sarang||[]).length+'명'])};
  return {cols:['이름','등록일','상태','돌봄목자'],rows:DB.NC.filter(n=>n.gu===g.name).map(n=>[n.name,fmt(n.reg),n.status,nm(n.carer)||'-'])}}
function rollModal(r){modal(`<div class="bar"><h2 style="flex:1;margin:0">${esc(r.title)}</h2><button class="btn sm" data-act="close">닫기</button></div><p class="rm">교적 앱에서 ${fmt(r.date)} 받음 (샘플 자료)</p><div class="scroll"><table class="t"><thead><tr>${r.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${r.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)}
function visitModal(id){
  const v=id?DB.V.find(x=>x.id===id):null;const g=curGU();if(v)audit('v',v.id);

}
async function guAI(){
  const g=curGU(),s=guStats();const month=TODAY.slice(0,7);const vs=myV().filter(v=>v.date.slice(0,7)===month);const ut=UTYPE(g);
  const by={};vs.filter(v=>!v.planned).forEach(v=>by[v.type]=(by[v.type]||0)+1);const done=Object.values(by).reduce((a,b)=>a+b,0);
  const zs=ut==='교구'?g.zones.slice().sort((a,b)=>a.visited/a.hh-b.visited/b.hh):zoneStats(g).sort((a,b)=>a.att-b.att).map(x=>x.z);const care2=careMain(g);
  const text=[`- 이번 달 심방 ${done}건${done?': '+Object.entries(by).map(([k,v])=>k+' '+v).join(', '):''}`,`- 예정 ${vs.filter(v=>v.planned).length}건 · 후속 조치 남음 ${s.follow}건 · 올해 심방률 ${s.pct}%`,
    `- 먼저 챙길 ${ut==='교구'?'가정':'사람'} ${care2.length}: ${care2.slice(0,5).map(x=>kjName(x.r,ut)+'('+x.R[0].k+')').join(', ')||'없음'}`,
    zs[0]?`- 다음 주 챙길 ${ZT(g)}: ${zs[0].name}`:'','(이 기기 안에서 교적 기본 사항과 심방 기록으로 정리했습니다. 외부로 보내지 않았습니다)'].filter(Boolean).join('\n');
  const x={id:uid('su'),date:TODAY,title:`${Number(month.slice(5))}월 ${g.name} 심방 정리`,text,gu:g.name};DB.SUMS.unshift(x);save();render();sumModal(x.id);
}
function sumModal(id){const x=DB.SUMS.find(s=>s.id===id);modal(`<div class="bar"><span class="chip">AI 정리</span><span class="sp"></span><button class="btn sm" data-act="close">닫기</button></div><h2 style="margin-top:12px">${esc(x.title)}</h2><p class="rm">${fmt(x.date)}</p><div class="body">${esc(x.text)}</div>`)}

function thumbOf(file){return new Promise(res=>{if(!file||!file.type||!file.type.startsWith('image/'))return res(null);const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=160,c=document.createElement('canvas');const r=Math.max(s/img.width,s/img.height);c.width=s;c.height=s;c.getContext('2d').drawImage(img,(s-img.width*r)/2,(s-img.height*r)/2,img.width*r,img.height*r);URL.revokeObjectURL(url);try{res(c.toDataURL('image/jpeg',.6))}catch(e){res(null)}};img.onerror=()=>res(null);img.src=url})}
